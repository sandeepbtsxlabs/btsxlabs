<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTSX Labs — Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        /* Subtle ambient glow effect in the background */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(15, 23, 42, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 650px;
            width: 100%;
        }
        .logo-wrapper {
            margin-bottom: 32px;
            display: inline-block;
            padding: 20px 32px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        }
        .logo-svg {
            width: 100%;
            max-width: 420px; /* Increased overall size */
            height: auto;
            display: block;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(30, 41, 59, 0.7);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.025em;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
        }
        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        h1 {
            font-size: clamp(2rem, 4vw, 2.75rem);
            margin-bottom: 14px;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #ffffff;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 520px;
            margin: 0 auto 28px auto;
        }
        .contact-info {
            display: inline-block;
            color: #94a3b8;
            font-size: 0.95rem;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .contact-info a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
        .contact-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">
            <span class="badge-dot"></span>
            Under Construction
        </div>

        <div class="logo-wrapper">
            <!-- Enlarged Code-Based Logo Graphic -->
            <svg class="logo-svg" viewBox="0 0 380 90" xmlns="http://www.w3.org/2000/svg">
                <!-- Icon Graphic Representation -->
                <g fill="none" stroke="#38bdf8" stroke-width="2.5">
                    <rect x="12" y="15" width="60" height="60" rx="10" stroke-opacity="0.4"/>
                    <path d="M30 45 L42 32 L54 45 L42 58 Z" fill="#38bdf8" fill-opacity="0.25"/>
                </g>
                <!-- Text: BTSX LABS (Larger font size and spacing) -->
                <text x="92" y="46" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="3">BTSX</text>
                <text x="184" y="46" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="3">LABS</text>
                <!-- Subtext -->
                <text x="94" y="68" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" letter-spacing="1.5">btsxlabs.com</text>
            </svg>
        </div>
        
        <h1>Something's being built here</h1>
        <p>We are currently setting up our digital headquarters. Check back soon for updates!</p>
        
        <div class="contact-info">
            Get in touch: <a href="mailto:sandeep@btsxlabs.com">sandeep@btsxlabs.com</a>
        </div>
    </div>

</body>
</html>
